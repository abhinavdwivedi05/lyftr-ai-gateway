services:
  - type: web
    name: lyftr-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_MODEL
        value: gemini/gemini-flash-lite-latest
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: MOCK_LLM
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000"
      - key: LLM_API_KEYS
        sync: false
